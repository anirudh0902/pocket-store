{% extends 'admin_dashboard/base_admin.html' %}

{% block title %}Confirm Delete {{ item_type }} | POCKET Admin{% endblock %}

{% block admin_content %}
<div class="max-w-md mx-auto py-16">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl text-center space-y-4">
        <div class="w-16 h-16 mx-auto rounded-full bg-red-100 text-red-600 flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>
        <h2 class="text-xl font-bold text-navy-900">Delete this {{ item_type }}?</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
            Are you sure you want to permanently delete <strong>{{ item.name }}</strong>?
        </p>

        <form method="POST" class="pt-4 flex items-center justify-center gap-3">
            {% csrf_token %}
            <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl transition shadow-md">
                Yes, Delete
            </button>
            <a href="{% url cancel_url %}" class="px-6 py-2.5 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-50 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
