{% extends 'admin_dashboard/base_admin.html' %}

{% block title %}{{ title }} | POCKET Admin{% endblock %}

{% block admin_content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <a href="{% url 'admin_dashboard:category_list' %}" class="text-xs font-bold text-orange-600 hover:underline">&larr; Back to Categories</a>
        <h1 class="text-2xl font-black text-navy-900 tracking-tight mt-1">{{ title }}</h1>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-navy-900 mb-1">Category Name *</label>
            <input type="text" name="name" value="{{ category.name|default:'' }}" required placeholder="e.g. Trendy T-Shirts & Tops" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <div>
            <label class="block text-xs font-bold text-navy-900 mb-1">Description</label>
            <textarea name="description" rows="3" placeholder="Brief summary of items in this category" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">{{ category.description|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-navy-900 mb-1">Display Sort Order</label>
                <input type="number" name="display_order" value="{{ category.display_order|default:0 }}" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            <div class="flex items-center pt-5">
                <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-navy-900">
                    <input type="checkbox" name="is_active" {% if not category or category.is_active %}checked{% endif %} class="rounded border-slate-300 text-orange-500 focus:ring-orange-500">
                    <span>Category Active</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-navy-900 mb-1">Category Image / Banner (Optional)</label>
            <input type="file" name="image" accept="image/*" class="w-full text-xs p-2 rounded-xl border border-slate-300 bg-slate-50">
        </div>

        <div class="pt-4 border-t border-slate-200 flex items-center gap-4">
            <button type="submit" class="px-8 py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-xs rounded-xl transition shadow-md">
                Save Category
            </button>
            <a href="{% url 'admin_dashboard:category_list' %}" class="px-6 py-3.5 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-50 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
