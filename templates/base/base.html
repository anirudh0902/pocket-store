{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POCKET | Fashion that fits your pocket{% endblock %}</title>
    
    <!-- Official Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'images/pocket_logo.jpg' %}">
    <link rel="apple-touch-icon" href="{% static 'images/pocket_logo.jpg' %}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#F0F4F8',
                            100: '#D9E2EC',
                            200: '#BCCCDC',
                            300: '#9FB3C8',
                            400: '#829AB1',
                            500: '#627D98',
                            600: '#486581',
                            700: '#334E68',
                            800: '#162238', // Deep Navy brand primary
                            900: '#0B162C', // Logo corner Navy
                            950: '#060D1A',
                        },
                        orange: {
                            50: '#FFF7ED',
                            100: '#FFEDD5',
                            200: '#FED7AA',
                            300: '#FDBA74',
                            400: '#FB923C',
                            500: '#F7892A', // Logo bag Orange
                            600: '#EA580C',
                            700: '#C2410C',
                            800: '#9A3412',
                            900: '#7C2D12',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS helpers -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #0F172A;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen text-slate-800 bg-white antialiased selection:bg-orange-500 selection:text-white">

    <!-- Global Messages Toast -->
    {% include 'base/messages.html' %}

    <!-- Global Navigation -->
    {% include 'base/navbar.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    {% include 'base/footer.html' %}

    {% block extra_js %}{% endblock %}
</body>
</html>
