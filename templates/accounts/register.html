{% extends 'base/base.html' %}
{% load static %}

{% block title %}Create Account | POCKET{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="{% url 'core:home' %}" class="inline-block">
                <img src="{% static 'images/pocket_logo.jpg' %}" alt="POCKET Logo" class="w-16 h-16 mx-auto rounded-2xl object-contain shadow-sm border border-slate-200">
            </a>
            <h2 class="text-2xl font-black text-navy-900 tracking-tight">Create your POCKET Account</h2>
            <p class="text-xs text-slate-500">Sign up to enjoy pocket-friendly fashion and instant order tracking</p>
        </div>

        <!-- Registration Form -->
        <form action="{% url 'accounts:register' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-navy-900 mb-1">First Name *</label>
                    <input type="text" name="first_name" required placeholder="John" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-navy-900 mb-1">Last Name</label>
                    <input type="text" name="last_name" placeholder="Doe" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-navy-900 mb-1">Email Address *</label>
                <input type="email" name="email" required placeholder="you@example.com" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-navy-900 mb-1">Mobile Number</label>
                <input type="tel" name="phone_number" placeholder="+91 98765 43210" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-navy-900 mb-1">Password *</label>
                    <input type="password" name="password" required minlength="6" placeholder="Min. 6 chars" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-navy-900 mb-1">Confirm Password *</label>
                    <input type="password" name="password_confirm" required minlength="6" placeholder="Re-type password" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-xs rounded-xl transition shadow-lg shadow-orange-500/25">
                    Create Account
                </button>
            </div>
        </form>

        <!-- Footer link -->
        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-500">
                Already have an account? 
                <a href="{% url 'accounts:login' %}" class="font-bold text-navy-900 hover:text-orange-600 underline ml-1">Log in here</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
