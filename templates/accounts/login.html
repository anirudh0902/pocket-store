{% extends 'base/base.html' %}
{% load static %}

{% block title %}Login | POCKET - Fashion that fits your pocket{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="{% url 'core:home' %}" class="inline-block">
                <img src="{% static 'images/pocket_logo.jpg' %}" alt="POCKET Logo" class="w-16 h-16 mx-auto rounded-2xl object-contain shadow-sm border border-slate-200">
            </a>
            <h2 class="text-2xl font-black text-navy-900 tracking-tight">Sign in to POCKET</h2>
            <p class="text-xs text-orange-600 font-semibold">{{ brand.TAGLINE }}</p>
        </div>

        <!-- Login Form -->
        <form action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold text-navy-900 mb-1">Email or Username *</label>
                <input type="text" name="login_id" required placeholder="Enter your email or username" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-navy-900 mb-1">Password *</label>
                <input type="password" name="password" required placeholder="Enter your password" class="w-full text-xs p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                    <input type="checkbox" name="remember" class="rounded border-slate-300 text-orange-500 focus:ring-orange-500">
                    <span>Remember me</span>
                </label>
                <a href="mailto:{{ site_config.support_email }}?subject=Password%20Reset%20Request" class="font-bold text-orange-600 hover:underline">Forgot password?</a>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3.5 bg-navy-900 hover:bg-navy-950 text-white font-extrabold text-xs rounded-xl transition shadow-lg">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Footer link -->
        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-500">
                Don't have an account yet? 
                <a href="{% url 'accounts:register' %}" class="font-bold text-orange-600 hover:text-orange-700 underline ml-1">Create one now</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
